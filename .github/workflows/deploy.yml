name: Deploy to GitHub Pages

on:
  push:
    branches: [sourcecode]
  schedule:
    - cron: '0 * * * *'      # ogni ora — rigenera progetti e post, poi deploya
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # ── Aggiornamento dati ───────────────────────────────────────────────────
      # I JSON sono committati nel repo come ultimo stato noto buono: ogni run
      # li rigenera e li ricommitta, così il sito ha sempre dati validi da
      # servire anche se un run futuro non riesce a fare fetch (rate limit,
      # API down, ecc.).
      - name: Fetch projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-projects.js

      - name: Install RSS browser
        run: npx playwright install --with-deps chromium

      - name: Fetch blog posts
        run: node scripts/fetch-posts.js

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/projects.json public/posts.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica ai dati, skip commit."
          else
            git commit -m "chore: aggiorna projects.json e posts.json [skip ci]"
            git pull --rebase origin sourcecode
            git push
          fi

      # ── Build & Deploy ────────────────────────────────────────────────────────
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
