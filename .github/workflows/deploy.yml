name: Deploy to GitHub Pages

on:
  push:
    branches: [sourcecode]
  schedule:
    - cron: '0 * * * *'      # ogni ora — rigenera progetti e post, poi deploya
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      # ── Aggiornamento dati ───────────────────────────────────────────────────
      # I JSON non sono committati: ogni deploy li rigenera nel runner e li
      # include solo nell'artifact GitHub Pages.
      - name: Fetch projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-projects.js

      - name: Install RSS browser
        run: npx playwright install --with-deps chromium

      - name: Fetch blog posts
        run: node scripts/fetch-posts.js

      # ── Build & Deploy ────────────────────────────────────────────────────────
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
